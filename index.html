<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Compound walk — house map</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;600&family=Fraunces:opsz,wght@9..144,500;9..144,700&display=swap"
      rel="stylesheet"
    />
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #1c1710;
      }
      #c {
        display: block;
        width: 100%;
        height: 100%;
      }
      #overlay {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background:
          radial-gradient(ellipse at 30% 20%, rgba(196, 92, 42, 0.18), transparent 50%),
          rgba(22, 18, 14, 0.78);
        color: #f3ead8;
        cursor: pointer;
        z-index: 5;
      }
      #overlay.hidden {
        display: none;
      }
      .card {
        width: min(34rem, 92vw);
        padding: 2.2rem 2.4rem 2rem;
        background: #f1e6d0;
        color: #2a2118;
        box-shadow: 8px 12px 0 #8b3a2a;
        border: 1px solid #2a2118;
      }
      .card h1 {
        font-family: Fraunces, serif;
        font-size: 2.1rem;
        font-weight: 700;
        margin: 0 0 0.35rem;
        letter-spacing: -0.02em;
      }
      .card p {
        font-family: Figtree, sans-serif;
        margin: 0 0 1rem;
        line-height: 1.45;
        font-size: 1.02rem;
      }
      .keys {
        font-family: Figtree, sans-serif;
        font-size: 0.88rem;
        display: grid;
        grid-template-columns: auto 1fr;
        gap: 0.25rem 0.9rem;
      }
      kbd {
        font-family: Figtree, sans-serif;
        background: #2a2118;
        color: #f1e6d0;
        padding: 0.08rem 0.4rem;
        font-size: 0.8rem;
      }
      #hud {
        position: fixed;
        left: 1.1rem;
        bottom: 1.1rem;
        z-index: 4;
        pointer-events: none;
        font-family: Figtree, sans-serif;
        color: #f3ead8;
        text-shadow: 0 1px 0 #1c1710;
      }
      #room {
        font-family: Fraunces, serif;
        font-size: 1.35rem;
      }
      #look {
        min-height: 1.2rem;
        opacity: 0.9;
        font-size: 0.95rem;
      }
      #crosshair {
        position: fixed;
        left: 50%;
        top: 50%;
        width: 10px;
        height: 10px;
        margin: -5px 0 0 -5px;
        border: 1.5px solid #f3ead8;
        border-radius: 50%;
        z-index: 4;
        pointer-events: none;
        box-shadow: 0 0 0 1px #1c1710;
      }
      #mini {
        position: fixed;
        right: 1rem;
        top: 1rem;
        width: 168px;
        height: 168px;
        z-index: 4;
        background: #f1e6d0;
        border: 1px solid #2a2118;
        box-shadow: 4px 4px 0 #8b3a2a;
      }
    </style>
  </head>
  <body>
    <canvas id="c"></canvas>
    <div id="crosshair"></div>
    <canvas id="mini" width="168" height="168"></canvas>
    <div id="hud">
      <div id="room">Public road</div>
      <div id="look"></div>
    </div>
    <div id="overlay">
      <div class="card">
        <h1>Walk the compound</h1>
        <p>
          Click to step inside the map. You spawn on the public road, facing the
          main gate. Every room on the plan is enterable.
        </p>
        <div class="keys">
          <span><kbd>W</kbd> <kbd>A</kbd> <kbd>S</kbd> <kbd>D</kbd></span>
          <span>walk</span>
          <span><kbd>Shift</kbd></span>
          <span>faster</span>
          <span><kbd>T</kbd></span>
          <span>top-down layout check</span>
          <span><kbd>Esc</kbd></span>
          <span>release mouse</span>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
